<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050814">
    <title>La Balanza · Catálogo BLUR Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --blur-cyan: #00d4ff;
            --blur-blue: #0066ff;
            --blur-dark: #050814;
            --blur-deep: #0a1128;
            --blur-glow: #00ffff;
            --blur-accent: #ff00aa;
            --blur-white: #e8f4ff;
            --success: #00ff88;
            --warning: #ffaa00;
            --whatsapp: #25D366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--blur-dark);
            color: var(--blur-white);
            overflow-x: hidden;
            min-height: 100vh;
            padding-bottom: 80px;
            position: relative;
        }

        /* Fondo con gradientes tipo BLUR */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(ellipse at top, rgba(0, 102, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
                linear-gradient(180deg, #050814 0%, #0a1128 50%, #050814 100%);
            z-index: -2;
        }

        /* Líneas de velocidad animadas estilo BLUR */
        .speed-lines {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .speed-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--blur-cyan), transparent);
            opacity: 0.3;
            animation: speedLine 8s linear infinite;
        }

        @keyframes speedLine {
            0% { transform: translateX(-100vw); }
            100% { transform: translateX(100vw); }
        }

        /* Nieve ligera (mantenida) */
        .snowflake {
            position: fixed;
            top: -10px;
            border-radius: 50%;
            background: white;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(105vh); }
        }

        /* NAVBAR */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(5, 8, 20, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(90deg, var(--blur-cyan), var(--blur-blue), var(--blur-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
            position: relative;
        }

        .logo::before {
            content: 'LA BALANZA';
            position: absolute;
            left: 2px; top: 2px;
            background: linear-gradient(90deg, var(--blur-accent), var(--blur-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.3;
            filter: blur(2px);
            z-index: -1;
        }

        .cart-btn {
            position: relative;
            background: rgba(10, 17, 40, 0.8);
            border: 1px solid rgba(0, 212, 255, 0.4);
            color: var(--blur-cyan);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
            z-index: 10;
        }

        .cart-btn:hover {
            border-color: var(--blur-cyan);
            box-shadow: 0 0 20px var(--blur-cyan);
            transform: scale(1.1);
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--blur-accent);
            color: white;
            font-size: 0.7rem;
            font-weight: 800;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--blur-dark);
            font-family: 'Orbitron', sans-serif;
        }

        .cart-badge.pulse {
            animation: pulse 0.3s ease;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* HERO */
        .hero {
            height: 40vh;
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 5%;
            margin-top: 70px;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 50%, rgba(0, 212, 255, 0.2) 0%, transparent 60%);
        }

        .hero-content {
            max-width: 700px;
            z-index: 2;
        }

        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 0.5rem;
            letter-spacing: 3px;
            background: linear-gradient(180deg, #fff 0%, var(--blur-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 212, 255, 0.6);
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 10px var(--blur-cyan)); }
            to { filter: drop-shadow(0 0 30px var(--blur-blue)); }
        }

        .hero h1 span {
            color: var(--blur-cyan);
            -webkit-text-fill-color: var(--blur-cyan);
        }

        .hero p {
            color: rgba(232, 244, 255, 0.7);
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* CONTROLES */
        .catalog-controls {
            padding: 2rem 5% 1rem;
            position: sticky;
            top: 70px;
            z-index: 90;
            background: rgba(5, 8, 20, 0.95);
            backdrop-filter: blur(10px);
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 1rem;
        }

        .search-wrapper::before {
            content: '🔍';
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            opacity: 0.6;
            z-index: 2;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            background: rgba(10, 17, 40, 0.8);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 0;
            color: var(--blur-white);
            font-size: 0.95rem;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
            outline: none;
            transition: all 0.3s;
            clip-path: polygon(15px 0, 100% 0, calc(100% - 15px) 100%, 0 100%);
        }

        .search-input:focus {
            border-color: var(--blur-cyan);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.5);
            background: rgba(10, 17, 40, 0.95);
        }

        .search-input::placeholder {
            color: rgba(0, 212, 255, 0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 8px;
        }

        .category-tabs::-webkit-scrollbar { display: none; }

        .cat-tab {
            padding: 8px 20px;
            background: rgba(10, 17, 40, 0.8);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 0;
            color: var(--blur-white);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
        }

        .cat-tab:hover {
            border-color: var(--blur-cyan);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .cat-tab.active {
            background: linear-gradient(90deg, var(--blur-cyan), var(--blur-blue));
            color: var(--blur-dark);
            border-color: transparent;
            box-shadow: 0 0 20px var(--blur-cyan);
        }

        /* CATÁLOGO */
        .catalog {
            padding: 1rem 5% 3rem;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1.2rem;
        }

        .movie-card {
            background: linear-gradient(135deg, rgba(10, 17, 40, 0.9), rgba(5, 8, 20, 0.9));
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        }

        .movie-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.2), transparent);
            transition: left 0.6s ease;
            z-index: 1;
        }

        .movie-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--blur-cyan);
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.4);
        }

        .movie-card:hover::before {
            left: 100%;
        }

        .movie-poster {
            position: relative;
            aspect-ratio: 2/3;
            overflow: hidden;
            background: #000;
            cursor: pointer;
        }

        .movie-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
            filter: saturate(1.1) contrast(1.05);
        }

        .movie-card:hover .movie-poster img {
            transform: scale(1.08);
        }

        /* Gorro de Santa */
        .movie-poster::after {
            content: '';
            position: absolute;
            top: -5px;
            right: -5px;
            width: 55px;
            height: 55px;
            background-image: url('gorro.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 10;
            pointer-events: none;
            transform: rotate(15deg);
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.6));
        }

        .badge-sin {
            position: absolute;
            top: 8px;
            left: 8px;
            background: linear-gradient(90deg, var(--blur-accent), #ff0066);
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            font-weight: 900;
            padding: 4px 10px;
            letter-spacing: 1px;
            z-index: 2;
            clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
        }

        .badge-rating {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(5, 8, 20, 0.9);
            border: 1px solid var(--warning);
            color: var(--warning);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 8px;
            z-index: 2;
            text-shadow: 0 0 10px var(--warning);
        }

        .movie-info {
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            position: relative;
            z-index: 2;
        }

        .movie-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .movie-genre {
            color: var(--blur-cyan);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--blur-cyan);
        }

        .btn-add-cart {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px;
            background: linear-gradient(90deg, var(--blur-cyan), var(--blur-blue));
            color: var(--blur-dark);
            border: none;
            border-radius: 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: auto;
            transition: all 0.3s;
            text-transform: uppercase;
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
        }

        .btn-add-cart:hover {
            box-shadow: 0 0 20px var(--blur-cyan);
            transform: translateY(-2px);
        }

        .btn-add-cart.added {
            background: linear-gradient(90deg, var(--success), #00cc66);
            color: var(--blur-dark);
            font-weight: 900;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
        }

        .btn-add-cart.added:hover {
            box-shadow: 0 0 25px var(--success);
        }

        /* MODAL CAPÍTULOS */
        .caps-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 20, 0.95);
            backdrop-filter: blur(10px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .caps-modal.active { display: flex; }

        .caps-panel {
            background: linear-gradient(135deg, rgba(10, 17, 40, 0.95), rgba(5, 8, 20, 0.95));
            border: 2px solid var(--blur-cyan);
            border-radius: 0;
            width: 100%;
            max-width: 350px;
            padding: 1.5rem;
            text-align: center;
            animation: popIn 0.3s ease;
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.4);
        }

        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .caps-panel h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: var(--blur-cyan);
            letter-spacing: 2px;
            text-shadow: 0 0 15px var(--blur-cyan);
        }

        .caps-panel p {
            color: rgba(232, 244, 255, 0.7);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
        }

        .caps-input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .caps-btn {
            width: 40px;
            height: 40px;
            border-radius: 0;
            border: 1px solid rgba(0, 212, 255, 0.4);
            background: rgba(10, 17, 40, 0.8);
            color: var(--blur-cyan);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
        }

        .caps-btn:hover {
            background: linear-gradient(90deg, var(--blur-cyan), var(--blur-blue));
            color: var(--blur-dark);
            box-shadow: 0 0 15px var(--blur-cyan);
        }

        .caps-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            width: 60px;
            text-align: center;
            color: var(--blur-cyan);
            text-shadow: 0 0 15px var(--blur-cyan);
        }

        .caps-preview {
            background: rgba(10, 17, 40, 0.6);
            padding: 0.8rem;
            border-radius: 0;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .caps-preview-price {
            font-family: 'Orbitron', sans-serif;
            color: var(--success);
            font-size: 1.3rem;
            font-weight: 900;
            text-shadow: 0 0 15px var(--success);
        }

        .caps-actions {
            display: flex;
            gap: 0.8rem;
        }

        .btn-cancel {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: var(--blur-white);
            border-radius: 0;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
        }

        .btn-confirm {
            flex: 1;
            padding: 10px;
            background: linear-gradient(90deg, var(--blur-cyan), var(--blur-blue));
            border: none;
            color: var(--blur-dark);
            border-radius: 0;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
            transition: all 0.3s;
        }

        .btn-confirm:hover {
            box-shadow: 0 0 20px var(--blur-cyan);
        }

        /* MODAL CARRITO */
        .cart-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 20, 0.95);
            backdrop-filter: blur(10px);
            z-index: 2000;
            justify-content: flex-end;
        }

        .cart-modal.active { display: flex; }

        .cart-panel {
            background: linear-gradient(135deg, rgba(10, 17, 40, 0.98), rgba(5, 8, 20, 0.98));
            width: 100%;
            max-width: 400px;
            height: 100%;
            border-left: 2px solid var(--blur-cyan);
            display: flex;
            flex-direction: column;
            animation: slideIn 0.3s ease;
            box-shadow: -10px 0 40px rgba(0, 212, 255, 0.3);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        .cart-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 8, 20, 0.5);
        }

        .cart-header h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--blur-cyan);
            letter-spacing: 2px;
            text-shadow: 0 0 15px var(--blur-cyan);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem;
            background: rgba(10, 17, 40, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.2);
            margin-bottom: 0.8rem;
            transition: all 0.3s;
        }

        .cart-item:hover {
            border-color: var(--blur-cyan);
            background: rgba(10, 17, 40, 0.8);
        }

        .cart-item-info { flex: 1; }

        .cart-item-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .cart-item-detail {
            font-size: 0.75rem;
            color: rgba(232, 244, 255, 0.6);
            letter-spacing: 1px;
        }

        .cart-item-price {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--success);
            font-weight: 900;
            text-shadow: 0 0 10px var(--success);
        }

        .cart-item-remove {
            background: none;
            border: none;
            color: var(--blur-accent);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px;
            transition: all 0.3s;
        }

        .cart-item-remove:hover {
            color: var(--blur-cyan);
            transform: scale(1.2);
        }

        .cart-footer {
            padding: 1.5rem;
            border-top: 1px solid rgba(0, 212, 255, 0.3);
            background: rgba(5, 8, 20, 0.8);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            margin-bottom: 1rem;
            color: var(--blur-cyan);
            letter-spacing: 2px;
        }

        .btn-checkout {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(90deg, var(--whatsapp), #1da851);
            color: #000;
            border: none;
            border-radius: 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
            text-transform: uppercase;
            clip-path: polygon(15px 0, 100% 0, calc(100% - 15px) 100%, 0 100%);
        }

        .btn-checkout:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(37, 211, 102, 0.4);
        }

        .btn-checkout:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* MODAL INFO */
        .info-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 20, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1500;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .info-modal.active { display: flex; }

        .info-content {
            background: linear-gradient(135deg, rgba(10, 17, 40, 0.98), rgba(5, 8, 20, 0.98));
            border: 2px solid var(--blur-cyan);
            border-radius: 0;
            max-width: 500px;
            width: 100%;
            overflow: hidden;
            position: relative;

        }

            right: 1rem;
            background: var(--blur-accent);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            cursor: pointer;
            z-index: 10;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);

        .info-close:hover {
            box-shadow: 0 0 15px var(--blur-accent);
            transform: scale(1.1);
        }

            .movie-poster::after { width: 40px; height: 40px; top: -2px; right: -2px; }
            .hero h1 { letter-spacing: 2px; }

    const CATEGORIAS = [
    {
        "id": "todos",
        "label": "Todos",
        "emoji": "🏠"
    },
    {
        "id": "Muñes",
        "label": "Muñes",
        "emoji": "🧸"
    },
    {
        "id": "Películas",
        "label": "Películas",
        "emoji": "🎥"
    },
    {
        "id": "Series",
        "label": "Series",
        "emoji": "📺"
    },
    {
        "id": "Animes",
        "label": "Animes",
        "emoji": "🎌"
    },
    {
        "id": "Doramas",
        "label": "Doramas",
        "emoji": "💕"
    }
];
    const PRECIO_PELICULA = 25;
    const PRECIO_CAPITULO = 15;
    let carrito = [];
    let filtroActual = 'todos';
    let busquedaActual = '';
    let itemTemporalCaps = null;
    let capsSeleccionados = 1;

    // ===== GENERADOR DE LÍNEAS DE VELOCIDAD ESTILO BLUR =====
    function crearSpeedLines() {
        const container = document.getElementById('speedLines');
        for (let i = 0; i < 12; i++) {
            const line = document.createElement('div');
            line.className = 'speed-line';
            line.style.top = Math.random() * 100 + '%';
            line.style.width = (Math.random() * 200 + 100) + 'px';
            line.style.animationDuration = (Math.random() * 5 + 5) + 's';
            line.style.animationDelay = Math.random() * 5 + 's';
            container.appendChild(line);
        }
    }

    // ===== GENERADOR DE NIEVE LIGERA =====
    function crearNieve() {
        const numCopos = 30;
        for (let i = 0; i < numCopos; i++) {
            const copo = document.createElement('div');
            copo.className = 'snowflake';
            const tamano = Math.random() * 4 + 2;
            copo.style.width = tamano + 'px';
            copo.style.height = tamano + 'px';
            copo.style.left = Math.random() * 100 + 'vw';
            const duracion = Math.random() * 4 + 3;
            copo.style.animationDuration = duracion + 's';
            copo.style.animationDelay = Math.random() * 5 + 's';
            copo.style.opacity = Math.random() * 0.5 + 0.3;
            document.body.appendChild(copo);
        }
    }

    function init() {
        crearSpeedLines();
        crearNieve();
        renderCategoryTabs();
        renderGrid();
        document.getElementById('searchInput').addEventListener('input', (e) => {
            busquedaActual = e.target.value.toLowerCase();
            renderGrid();
        });
    }

    function renderCategoryTabs() {
        const container = document.getElementById('categoryTabs');
        container.innerHTML = CATEGORIAS.map(cat =>
            `<button class="cat-tab ${cat.id === 'todos' ? 'active' : ''}" onclick="setFilter('${cat.id}', this)">${cat.emoji} ${cat.label}</button>`
        ).join('');
    }

    function setFilter(catId, btnElement) {
        filtroActual = catId;
        document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
        btnElement.classList.add('active');
        renderGrid();
    }

    function obtenerEstadoEnCarrito(item) {
        const esSerie = ['Series', 'Animes', 'Doramas'].includes(item.categoria);
        if (esSerie) {
            const entradas = carrito.filter(c => c.nombre === item.nombre && c.tipo === 'Serie');
            if (entradas.length === 0) return null;
            return entradas[0];
        } else {
            return carrito.find(c => c.nombre === item.nombre && c.tipo !== 'Serie') || null;
        }
    }

    function renderGrid() {
        const grid = document.getElementById('moviesGrid');
        const filtrados = catalogo.filter(item => {
            const matchCat = filtroActual === 'todos' || item.categoria === filtroActual;
            const matchSearch = item.nombre.toLowerCase().includes(busquedaActual) || item.nombre_base.toLowerCase().includes(busquedaActual);
            return matchCat && matchSearch;
        });

        document.getElementById('noResults').style.display = filtrados.length === 0 ? 'block' : 'none';

        grid.innerHTML = filtrados.map(item => {
            const esSerie = ['Series', 'Animes', 'Doramas'].includes(item.categoria);
            const precio = esSerie ? (item.caps_totales * PRECIO_CAPITULO) : PRECIO_PELICULA;
            const badgeSin = item.sin_caratula ? '<span class="badge-sin">PRÓXIMAMENTE</span>' : '';
            const badgeRating = item.rating ? `<span class="badge-rating">⭐ ${item.rating}</span>` : '';
            const nombreEscapado = item.nombre.replace(/'/g, "\\'");
            const estadoCarrito = obtenerEstadoEnCarrito(item);
            let textoBtn, claseBtn;
            if (estadoCarrito) {
                if (estadoCarrito.tipo === 'Serie') {
                    textoBtn = `✓ ${estadoCarrito.cantidad_caps} caps`;
                } else {
                    textoBtn = '✓ Agregado';
                }
                claseBtn = 'btn-add-cart added';
            } else {
                textoBtn = esSerie ? `🛒 Desde ${PRECIO_CAPITULO} CUP/cap` : `🛒 ${precio} CUP`;
                claseBtn = 'btn-add-cart';
            }
            return `
            <div class="movie-card">
                <div class="movie-poster" onclick="openInfoModal('${nombreEscapado}')">
                    <img src="${item.poster}" alt="${item.nombre}" loading="lazy" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iNDUwIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMDUwODE0Ii8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJzYW5zLXNlcmlmIiBmb250LXNpemU9IjIwIiBmaWxsPSIjMDBkNGZmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5TSU4gQ0FSw4FUVUxBPC90ZXh0Pjwvc3ZnPg=='">
                    ${badgeSin}
                    ${badgeRating}
                </div>
                <div class="movie-info">
                    <span class="movie-genre">${item.categoria}</span>
                    <h3 class="movie-title" onclick="openInfoModal('${nombreEscapado}')">${item.nombre}</h3>
                    <button class="${claseBtn}" onclick="prepararAgregar('${nombreEscapado}')">
                        ${textoBtn}
                    </button>
                </div>
            </div>`;
        }).join('');
    }

    function prepararAgregar(nombre) {
        const item = catalogo.find(i => i.nombre === nombre);
        if (!item) return;
        if (['Series', 'Animes', 'Doramas'].includes(item.categoria) && item.caps_totales > 0) {
            itemTemporalCaps = item;
            capsSeleccionados = 1;
            document.getElementById('capsModalTitle').textContent = item.nombre;
            document.getElementById('capsModalDesc').textContent = `Máximo disponible: ${item.caps_totales} caps (${PRECIO_CAPITULO} CUP c/u)`;
            document.getElementById('capsDisplay').textContent = capsSeleccionados;
            document.getElementById('capsPreviewPrice').textContent = (capsSeleccionados * PRECIO_CAPITULO) + ' CUP';
            document.getElementById('capsModal').classList.add('active');
        } else {
            agregarAlCarrito(item, 1, item.categoria === 'Muñes' ? 'Muñes' : 'Película');
        }
    }

    function ajustarCaps(cantidad) {
        const nuevo = capsSeleccionados + cantidad;
        if (nuevo >= 1 && nuevo <= itemTemporalCaps.caps_totales) {
            capsSeleccionados = nuevo;
            document.getElementById('capsDisplay').textContent = capsSeleccionados;
            document.getElementById('capsPreviewPrice').textContent = (capsSeleccionados * PRECIO_CAPITULO) + ' CUP';
        }
    }

    function confirmarAgregarCaps() {
        if (itemTemporalCaps) {
            agregarAlCarrito(itemTemporalCaps, capsSeleccionados, 'Serie');
            cerrarCapsModal();
        }
    }

    function cerrarCapsModal() {
        document.getElementById('capsModal').classList.remove('active');
        itemTemporalCaps = null;
    }

    function agregarAlCarrito(item, cantidad, tipo) {
        const existente = carrito.find(c => c.nombre === item.nombre && c.cantidad_caps === cantidad && c.tipo === tipo);
        if (existente) {
            return;
        }
        const precioUnitario = tipo === 'Serie' ? PRECIO_CAPITULO : PRECIO_PELICULA;
        const precioTotal = precioUnitario * cantidad;
        carrito.push({
            nombre: item.nombre,
            cantidad_caps: cantidad,
            tipo: tipo,
            precioTotal: precioTotal
        });
        actualizarCarritoUI();
        renderGrid();
        const badge = document.getElementById('cart-badge');
        badge.classList.remove('pulse');
        void badge.offsetWidth;
        badge.classList.add('pulse');
    }

    function eliminarDelCarrito(index) {
        carrito.splice(index, 1);
        actualizarCarritoUI();
        renderGrid();
    }

    function actualizarCarritoUI() {
        const badge = document.getElementById('cart-badge');
        const cartItemsDiv = document.getElementById('cartItems');
        const cartTotalSpan = document.getElementById('cartTotal');
        const checkoutBtn = document.getElementById('checkoutBtn');
        const totalItems = carrito.length;
        badge.textContent = totalItems;
        badge.style.display = totalItems > 0 ? 'flex' : 'none';
        const total = carrito.reduce((sum, item) => sum + item.precioTotal, 0);
        cartTotalSpan.textContent = total + ' CUP';
        checkoutBtn.disabled = totalItems === 0;
        if (totalItems === 0) {
            cartItemsDiv.innerHTML = '<p style="text-align: center; color: rgba(232,244,255,0.5); margin-top: 2rem; letter-spacing: 2px;">El carrito está vacío</p>';
        } else {
            cartItemsDiv.innerHTML = carrito.map((item, index) => {
                const detalle = item.tipo === 'Serie' ? `${item.cantidad_caps} caps × ${PRECIO_CAPITULO} CUP` : '1 unidad';
                return `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.nombre}</div>
                        <div class="cart-item-detail">${detalle}</div>
                        <div class="cart-item-price">${item.precioTotal} CUP</div>
                    </div>
                    <button class="cart-item-remove" onclick="eliminarDelCarrito(${index})">🗑️</button>
                </div>`;
            }).join('');
        }
    }

    function toggleCart() {
        document.getElementById('cartModal').classList.toggle('active');
    }

    function enviarPedidoWhatsApp() {
        if (carrito.length === 0) return;
        let mensaje = "¡Hola *La Balanza*! 👋 Quiero hacer el siguiente pedido:\n\n";
        let total = 0;
        carrito.forEach(item => {
            total += item.precioTotal;
            const detalle = item.tipo === 'Serie' ? `(${item.cantidad_caps} caps)` : '';
            mensaje += `▪️ *${item.nombre}* ${detalle} - ${item.precioTotal} CUP\n`;
        });
        mensaje += `\n💰 *TOTAL A PAGAR: ${total} CUP*\n\n`;
        mensaje += "Quedo a la espera de los datos de pago. ¡Gracias!";
        const url = `https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(mensaje)}`;
        window.open(url, '_blank');
    }

    function openInfoModal(nombre) {
        const item = catalogo.find(m => m.nombre === nombre);
        if (!item) return;
        const esSerie = ['Series', 'Animes', 'Doramas'].includes(item.categoria);
        const precioInfo = esSerie ? `Desde ${PRECIO_CAPITULO} CUP por capítulo` : `${PRECIO_PELICULA} CUP`;
        document.getElementById('infoBody').innerHTML = `
            <img src="${item.poster}" style="width:100%; height:250px; object-fit:cover;" onerror="this.style.display='none'">
            <div style="padding: 1.5rem;">
                <span style="color: var(--blur-cyan); font-family: 'Orbitron'; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px var(--blur-cyan);">${item.categoria}</span>
                <h2 style="margin: 0.5rem 0 1rem 0; font-family: 'Orbitron'; font-size: 1.3rem; font-weight: 900; color: var(--blur-cyan); letter-spacing: 2px; text-shadow: 0 0 15px var(--blur-cyan);">${item.nombre}</h2>
                <p style="color: var(--success); font-family: 'Orbitron'; font-weight: 900; margin-bottom: 1rem; font-size: 1.1rem; text-shadow: 0 0 10px var(--success);">💵 ${precioInfo}</p>
                <p style="color: rgba(232,244,255,0.8); line-height: 1.6; margin-bottom: 1.5rem; font-size: 0.95rem; white-space: pre-wrap;">${item.sinopsis}</p>
                <button class="btn-add-cart" style="width:100%; padding: 1rem;" onclick="prepararAgregar('${nombre.replace(/'/g, "\\'")}'); closeInfoModal();">
                    🛒 Agregar al Carrito
                </button>
            </div>`;
        document.getElementById('infoModal').classList.add('active');
    }

    function closeInfoModal() {
        document.getElementById('infoModal').classList.remove('active');
    }

    init();
</script>

<html lang="es">

            --text-primary: #ffffff; --text-secondary: #a0a0a8;
            --border: rgba(255, 255, 255, 0.1);

            --whatsapp: #25D366;
            --success: #25D366;

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-dark); color: var(--text-primary); overflow-x: hidden; min-height: 100vh; padding-bottom: 80px; }
        
        .navbar { position: fixed; top: 0; width: 100%; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; z-index: 1000; background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
        .logo { font-size: 1.4rem; font-weight: 900; background: var(--gradient-red); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; }
        .cart-btn { position: relative; background: var(--bg-glass); border: 1px solid var(--border); color: white; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; transition: all 0.3s; }
        .cart-btn:hover { border-color: var(--primary); }
        .cart-badge { position: absolute; top: -5px; right: -5px; background: var(--primary); color: white; font-size: 0.7rem; font-weight: 800; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg-dark); }
        .cart-badge.pulse { animation: pulse 0.3s ease; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

        .hero { height: 40vh; position: relative; display: flex; align-items: center; padding: 0 5%; margin-top: 70px; overflow: hidden; }
        .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 20% 50%, rgba(229, 9, 20, 0.25) 0%, transparent 60%); }
        .hero-content { max-width: 700px; z-index: 2; }
        .hero h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 900; line-height: 1.1; margin-bottom: 0.5rem; }
        .hero h1 span { color: var(--primary); }
        
        .catalog-controls { padding: 2rem 5% 1rem; position: sticky; top: 70px; z-index: 90; background: var(--bg-dark); }
        .search-wrapper { position: relative; margin-bottom: 1rem; }
        .search-wrapper::before { content: '🔍'; position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 1rem; opacity: 0.6; z-index: 2; }
        .search-input { width: 100%; padding: 12px 16px 12px 44px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; color: white; font-size: 0.95rem; outline: none; transition: border-color 0.3s; }
        .search-input:focus { border-color: var(--primary); }
        
        .category-tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
        .category-tabs::-webkit-scrollbar { display: none; }
        .cat-tab { padding: 8px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; color: var(--text-secondary); font-size: 0.85rem; font-weight: 600; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
        .cat-tab.active { background: var(--gradient-red); color: white; border-color: transparent; }

        .catalog { padding: 1rem 5% 3rem; }
        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1.2rem; }
        .movie-card { background: var(--bg-card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); transition: all 0.3s; display: flex; flex-direction: column; }
        .movie-card:hover { transform: translateY(-6px); border-color: var(--primary); box-shadow: 0 10px 25px rgba(229, 9, 20, 0.2); }
        .movie-poster { position: relative; aspect-ratio: 2/3; overflow: hidden; background: #000; cursor: pointer; }
        .movie-poster img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
        .movie-card:hover .movie-poster img { transform: scale(1.05); }
        
        .badge-sin { position: absolute; top: 8px; right: 8px; background: var(--primary); color: white; font-size: 0.65rem; font-weight: 800; padding: 3px 8px; border-radius: 4px; z-index: 2; }
        .badge-rating { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.8); color: #ffd700; font-size: 0.75rem; font-weight: 700; padding: 3px 6px; border-radius: 4px; z-index: 2; }
        
        .movie-info { padding: 0.8rem; display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .movie-title { font-size: 0.9rem; font-weight: 700; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
        .movie-genre { color: var(--primary); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
        
        /* BOTÓN AGREGAR - ESTADOS NORMAL Y AGREGADO */
        .btn-add-cart { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px; background: var(--gradient-red); color: white; border: none; border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; margin-top: auto; transition: all 0.3s; }
        .btn-add-cart:hover { opacity: 0.9; transform: translateY(-1px); }
        
        /* NUEVO: ESTADO AGREGADO (VERDE CON ✓) */
        .btn-add-cart.added { 
            background: var(--success); 
            color: #000; 
            font-weight: 800;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }
        .btn-add-cart.added:hover { opacity: 0.95; }

        /* MODAL SELECCIONAR CAPÍTULOS */
        .caps-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 2000; align-items: center; justify-content: center; padding: 1rem; }
        .caps-modal.active { display: flex; }
        .caps-panel { background: var(--bg-card); border-radius: 16px; width: 100%; max-width: 350px; border: 1px solid var(--border); padding: 1.5rem; text-align: center; animation: popIn 0.3s ease; }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .caps-panel h3 { font-size: 1.1rem; margin-bottom: 0.5rem; }
        .caps-panel p { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem; }
        .caps-input-group { display: flex; align-items: center; justify-content: center; gap: 1rem; margin-bottom: 1.5rem; }
        .caps-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-glass); color: white; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .caps-btn:hover { background: var(--primary); border-color: var(--primary); }
        .caps-number { font-size: 1.5rem; font-weight: 800; width: 60px; text-align: center; }
        .caps-preview { background: var(--bg-glass); padding: 0.8rem; border-radius: 8px; margin-bottom: 1.5rem; border: 1px solid var(--border); }
        .caps-preview-price { color: var(--success); font-size: 1.2rem; font-weight: 800; }
        .caps-actions { display: flex; gap: 0.8rem; }
        .btn-cancel { flex: 1; padding: 10px; background: transparent; border: 1px solid var(--border); color: var(--text-secondary); border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-confirm { flex: 1; padding: 10px; background: var(--gradient-red); border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: 700; }

        /* MODAL CARRITO */
        .cart-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 2000; justify-content: flex-end; }
        .cart-modal.active { display: flex; }
        .cart-panel { background: var(--bg-card); width: 100%; max-width: 400px; height: 100%; border-left: 1px solid var(--border); display: flex; flex-direction: column; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .cart-header { padding: 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .cart-items { flex: 1; overflow-y: auto; padding: 1rem; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem; background: var(--bg-glass); border-radius: 8px; margin-bottom: 0.8rem; border: 1px solid var(--border); }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
        .cart-item-detail { font-size: 0.75rem; color: var(--text-secondary); }
        .cart-item-price { font-size: 0.85rem; color: var(--primary); font-weight: 700; }
        .cart-item-remove { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.2rem; padding: 4px; }
        .cart-item-remove:hover { color: var(--primary); }
        .cart-footer { padding: 1.5rem; border-top: 1px solid var(--border); background: var(--bg-dark); }
        .cart-total { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 800; margin-bottom: 1rem; }
        .btn-checkout { width: 100%; padding: 1rem; background: var(--whatsapp); color: #000; border: none; border-radius: 12px; font-size: 1rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
        .btn-checkout:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3); }
        .btn-checkout:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* MODAL INFO */
        .info-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1500; align-items: center; justify-content: center; padding: 1rem; }
        .info-modal.active { display: flex; }
        .info-content { background: var(--bg-card); border-radius: 16px; max-width: 500px; width: 100%; overflow: hidden; border: 1px solid var(--border); position: relative; max-height: 90vh; overflow-y: auto; }
        .info-close { position: absolute; top: 1rem; right: 1rem; background: rgba(0,0,0,0.6); border: 1px solid var(--border); color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; z-index: 10; }

        @media (max-width: 768px) {
            .movies-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
            .logo { font-size: 1.2rem; }
            .catalog-controls { top: 65px; }
        }
    </style>
</head>

    <nav class="navbar">
        <div class="logo">LA BALANZA</div>
        <button class="cart-btn" onclick="toggleCart()">

    <div class="catalog-controls">
        <div class="search-wrapper">

        </div>
        <div class="category-tabs" id="categoryTabs"></div>
    </div>

    <section class="catalog">
        <div class="movies-grid" id="moviesGrid"></div>
        <div id="noResults" style="display: none; text-align: center; padding: 40px; color: var(--text-secondary); grid-column: 1 / -1;">😕 No se encontraron resultados</div>
    </section>

    <!-- MODAL SELECCIONAR CAPÍTULOS -->
    <div class="caps-modal" id="capsModal">
        <div class="caps-panel">
            <h3 id="capsModalTitle">Seleccionar Capítulos</h3>
            <p id="capsModalDesc">Máximo disponible: X caps</p>
            <div class="caps-input-group">
                <button class="caps-btn" onclick="ajustarCaps(-1)">−</button>
                <span class="caps-number" id="capsDisplay">1</span>
                <button class="caps-btn" onclick="ajustarCaps(1)">+</button>
            </div>
            <div class="caps-preview">
                <div style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 4px;">Total a pagar:</div>
                <div class="caps-preview-price" id="capsPreviewPrice">15 CUP</div>
            </div>
            <div class="caps-actions">
                <button class="btn-cancel" onclick="cerrarCapsModal()">Cancelar</button>
                <button class="btn-confirm" onclick="confirmarAgregarCaps()">✓ Confirmar</button>
            </div>
        </div>
    </div>

    <!-- MODAL CARRITO -->
    <div class="cart-modal" id="cartModal" onclick="if(event.target === this) toggleCart()">
        <div class="cart-panel">
            <div class="cart-header">
                <h3 style="font-size: 1.2rem; font-weight: 800;">🛒 Tu Pedido</h3>
                <button onclick="toggleCart()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">✕</button>
            </div>
            <div class="cart-items" id="cartItems">
                <p style="text-align: center; color: var(--text-secondary); margin-top: 2rem;">El carrito está vacío</p>
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="cartTotal">0 CUP</span>
                </div>
                <button class="btn-checkout" id="checkoutBtn" onclick="enviarPedidoWhatsApp()" disabled>
                    💬 Enviar Pedido por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL INFORMACIÓN -->
    <div class="info-modal" id="infoModal" onclick="if(event.target === this) closeInfoModal()">
        <div class="info-content">
            <button class="info-close" onclick="closeInfoModal()">✕</button>
            <div id="infoBody"></div>
        </div>
    </div>

        const PRECIO_PELICULA = 25;
        const PRECIO_CAPITULO = 15;

        let carrito = [];
        let filtroActual = 'todos';
        let busquedaActual = '';
        let itemTemporalCaps = null;
        let capsSeleccionados = 1;

        function init() {
            renderCategoryTabs();
            renderGrid();
            
            document.getElementById('searchInput').addEventListener('input', (e) => {
                busquedaActual = e.target.value.toLowerCase();
                renderGrid();
            });
        }

        function renderCategoryTabs() {
            const container = document.getElementById('categoryTabs');
            container.innerHTML = CATEGORIAS.map(cat => 
                `<button class="cat-tab ${cat.id === 'todos' ? 'active' : ''}" onclick="setFilter('${cat.id}', this)">${cat.emoji} ${cat.label}</button>`
            ).join('');
        }

        function setFilter(catId, btnElement) {
            filtroActual = catId;
            document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
            btnElement.classList.add('active');
            renderGrid();
        }

        // NUEVA FUNCIÓN: Verifica si un item está en el carrito y devuelve info
        function obtenerEstadoEnCarrito(item) {
            const esSerie = ['Series', 'Animes', 'Doramas'].includes(item.categoria);
            
            if (esSerie) {
                // Para series, buscamos cualquier entrada con el mismo nombre
                const entradas = carrito.filter(c => c.nombre === item.nombre && c.tipo === 'Serie');
                if (entradas.length === 0) return null;
                // Si hay múltiples, mostramos la primera cantidad
                return entradas[0];
            } else {
                // Para películas/muñes, buscamos entrada exacta
                return carrito.find(c => c.nombre === item.nombre && c.tipo !== 'Serie') || null;
            }
        }

        function renderGrid() {
            const grid = document.getElementById('moviesGrid');
            const filtrados = catalogo.filter(item => {
                const matchCat = filtroActual === 'todos' || item.categoria === filtroActual;
                const matchSearch = item.nombre.toLowerCase().includes(busquedaActual) || item.nombre_base.toLowerCase().includes(busquedaActual);
                return matchCat && matchSearch;
            });

            document.getElementById('noResults').style.display = filtrados.length === 0 ? 'block' : 'none';

            grid.innerHTML = filtrados.map(item => {
                const esSerie = ['Series', 'Animes', 'Doramas'].includes(item.categoria);
                const precio = esSerie ? (item.caps_totales * PRECIO_CAPITULO) : PRECIO_PELICULA;
                const badgeSin = item.sin_caratula ? '<span class="badge-sin">Próximamente</span>' : '';
                const badgeRating = item.rating ? `<span class="badge-rating">⭐ ${item.rating}</span>` : '';
                const nombreEscapado = item.nombre.replace(/'/g, "\\'");
                
                // NUEVO: Verificar si está en el carrito
                const estadoCarrito = obtenerEstadoEnCarrito(item);
                let textoBtn, claseBtn;
                
                if (estadoCarrito) {
                    // YA ESTÁ EN EL CARRITO → VERDE CON ✓
                    if (estadoCarrito.tipo === 'Serie') {
                        textoBtn = `✓ ${estadoCarrito.cantidad_caps} caps agregados`;
                    } else {
                        textoBtn = '✓ Agregado';
                    }
                    claseBtn = 'btn-add-cart added';
                } else {
                    // NO ESTÁ EN EL CARRITO → ROJO NORMAL
                    textoBtn = esSerie ? `🛒 Agregar (Desde ${PRECIO_CAPITULO} CUP/cap)` : `🛒 Agregar (${precio} CUP)`;
                    claseBtn = 'btn-add-cart';
                }

                return `
                <div class="movie-card">
                    <div class="movie-poster" onclick="openInfoModal('${nombreEscapado}')">
                        <img src="${item.poster}" alt="${item.nombre}" loading="lazy" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iNDUwIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMTYxNjFkIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJzYW5zLXNlcmlmIiBmb250LXNpemU9IjIwIiBmaWxsPSIjZTUwOTE0IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5TSU4gQ0FSw4FUVUxBPC90ZXh0Pjwvc3ZnPg=='">
                        ${badgeSin}
                        ${badgeRating}
                    </div>
                    <div class="movie-info">
                        <span class="movie-genre">${item.categoria}</span>
                        <h3 class="movie-title" onclick="openInfoModal('${nombreEscapado}')">${item.nombre}</h3>
                        <button class="${claseBtn}" onclick="prepararAgregar('${nombreEscapado}')">
                            ${textoBtn}
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        // --- LÓGICA DE CAPÍTULOS ---
        function prepararAgregar(nombre) {
            const item = catalogo.find(i => i.nombre === nombre);
            if (!item) return;

            if (['Series', 'Animes', 'Doramas'].includes(item.categoria) && item.caps_totales > 0) {
                itemTemporalCaps = item;
                capsSeleccionados = 1;
                document.getElementById('capsModalTitle').textContent = item.nombre;
                document.getElementById('capsModalDesc').textContent = `Máximo disponible: ${item.caps_totales} caps (${PRECIO_CAPITULO} CUP c/u)`;
                document.getElementById('capsDisplay').textContent = capsSeleccionados;
                document.getElementById('capsPreviewPrice').textContent = (capsSeleccionados * PRECIO_CAPITULO) + ' CUP';
                document.getElementById('capsModal').classList.add('active');
            } else {
                agregarAlCarrito(item, 1, item.categoria === 'Muñes' ? 'Muñes' : 'Película');
            }
        }

        function ajustarCaps(cantidad) {
            const nuevo = capsSeleccionados + cantidad;
            if (nuevo >= 1 && nuevo <= itemTemporalCaps.caps_totales) {
                capsSeleccionados = nuevo;
                document.getElementById('capsDisplay').textContent = capsSeleccionados;
                document.getElementById('capsPreviewPrice').textContent = (capsSeleccionados * PRECIO_CAPITULO) + ' CUP';
            }
        }

        function confirmarAgregarCaps() {
            if (itemTemporalCaps) {
                agregarAlCarrito(itemTemporalCaps, capsSeleccionados, 'Serie');
                cerrarCapsModal();
            }
        }

        function cerrarCapsModal() {
            document.getElementById('capsModal').classList.remove('active');
            itemTemporalCaps = null;
        }

        // --- LÓGICA DEL CARRITO ---
        function agregarAlCarrito(item, cantidad, tipo) {
            // Verificar si ya existe exactamente igual (mismo nombre y misma cantidad de caps)
            const existente = carrito.find(c => c.nombre === item.nombre && c.cantidad_caps === cantidad && c.tipo === tipo);
            if (existente) {
                return; // Ya está, no hacer nada
            }

            const precioUnitario = tipo === 'Serie' ? PRECIO_CAPITULO : PRECIO_PELICULA;
            const precioTotal = precioUnitario * cantidad;
            
            carrito.push({
                nombre: item.nombre,
                cantidad_caps: cantidad,
                tipo: tipo,
                precioTotal: precioTotal
            });
            
            actualizarCarritoUI();
            renderGrid(); // NUEVO: Actualizar el grid para mostrar el botón verde
            
            // Animación del badge
            const badge = document.getElementById('cart-badge');
            badge.classList.remove('pulse');
            void badge.offsetWidth;
            badge.classList.add('pulse');
        }

        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            actualizarCarritoUI();
            renderGrid(); // NUEVO: Actualizar el grid para que el botón vuelva a rojo
        }

        function actualizarCarritoUI() {
            const badge = document.getElementById('cart-badge');
            const cartItemsDiv = document.getElementById('cartItems');
            const cartTotalSpan = document.getElementById('cartTotal');
            const checkoutBtn = document.getElementById('checkoutBtn');

            const totalItems = carrito.length;
            badge.textContent = totalItems;
            badge.style.display = totalItems > 0 ? 'flex' : 'none';

            const total = carrito.reduce((sum, item) => sum + item.precioTotal, 0);
            cartTotalSpan.textContent = total + ' CUP';
            checkoutBtn.disabled = totalItems === 0;

            if (totalItems === 0) {
                cartItemsDiv.innerHTML = '<p style="text-align: center; color: var(--text-secondary); margin-top: 2rem;">El carrito está vacío</p>';
            } else {
                cartItemsDiv.innerHTML = carrito.map((item, index) => {
                    const detalle = item.tipo === 'Serie' ? `${item.cantidad_caps} caps × ${PRECIO_CAPITULO} CUP` : '1 unidad';
                    return `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.nombre}</div>
                            <div class="cart-item-detail">${detalle}</div>
                            <div class="cart-item-price">${item.precioTotal} CUP</div>
                        </div>
                        <button class="cart-item-remove" onclick="eliminarDelCarrito(${index})">🗑️</button>
                    </div>`;
                }).join('');
            }
        }

        function toggleCart() {
            document.getElementById('cartModal').classList.toggle('active');
        }

        function enviarPedidoWhatsApp() {
            if (carrito.length === 0) return;
            
            let mensaje = "¡Hola *La Balanza*! 👋 Quiero hacer el siguiente pedido:\n\n";
            let total = 0;
            
            carrito.forEach(item => {
                total += item.precioTotal;
                const detalle = item.tipo === 'Serie' ? `(${item.cantidad_caps} caps)` : '';
                mensaje += `▪️ *${item.nombre}* ${detalle} - ${item.precioTotal} CUP\n`;
            });
            
            mensaje += `\n💰 *TOTAL A PAGAR: ${total} CUP*\n\n`;
            mensaje += "Quedo a la espera de los datos de pago. ¡Gracias!";
            
            const url = `https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        // --- MODAL INFO ---
        function openInfoModal(nombre) {
            const item = catalogo.find(m => m.nombre === nombre);
            if (!item) return;
            
            const esSerie = ['Series', 'Animes', 'Doramas'].includes(item.categoria);
            const precioInfo = esSerie ? `Desde ${PRECIO_CAPITULO} CUP por capítulo` : `${PRECIO_PELICULA} CUP`;

            document.getElementById('infoBody').innerHTML = `
                <img src="${item.poster}" style="width:100%; height:250px; object-fit:cover;" onerror="this.style.display='none'">
                <div style="padding: 1.5rem;">
                    <span style="color: var(--primary); font-weight: 700; font-size: 0.85rem; text-transform: uppercase;">${item.categoria}</span>
                    <h2 style="margin: 0.5rem 0 1rem 0; font-size: 1.4rem; font-weight: 800;">${item.nombre}</h2>
                    <p style="color: var(--primary); font-weight: 700; margin-bottom: 1rem;">💵 Precio: ${precioInfo}</p>
                    <p style="color: var(--text-secondary); line-height: 1.6; margin-bottom: 1.5rem; font-size: 0.95rem; white-space: pre-wrap;">${item.sinopsis}</p>
                    <button class="btn-add-cart" style="width:100%; padding: 1rem;" onclick="prepararAgregar('${nombre.replace(/'/g, "\\'")}'); closeInfoModal();">
                        🛒 Agregar al Carrito
                    </button>
                </div>`;
            document.getElementById('infoModal').classList.add('active');
        }

        function closeInfoModal() {
            document.getElementById('infoModal').classList.remove('active');
        }

        init();
    </script>
</body>
</html>
